# Name of the application displayed in logs and configurations
spring.application.name=Architecture Evaluator Backend

# Active Spring profile (e.g., dev, prod, etc.)
spring.profiles.active=dev

# File size limit for uploaded files
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# Shrink JSON responses: omit nulls and gzip over the wire
spring.jackson.default-property-inclusion=non_null
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
